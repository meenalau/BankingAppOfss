name: Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'BankingApp/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'BankingApp/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./BankingApp
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: BankingApp/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build OJET app
        run: npx ojet build