<div class="oj-web-applayout-max-width oj-web-applayout-content">

  <h2>Transactions</h2>

  <!-- TRANSACTION FORM -->
  <oj-form-layout max-columns="3" direction="row">

    <!-- ACCOUNT ID -->
    <oj-input-text
      id="txnAccountId"
      label-hint="Account ID"
      value="{{accountId}}"
      required="true"
      validation-hint.required="Account ID is mandatory">
    </oj-input-text>

    <!-- AMOUNT -->
    <oj-input-text
      id="txnAmount"
      label-hint="Amount"
      value="{{amount}}"
      required="true"
      validation-hint.required="Amount is mandatory">
    </oj-input-text>

    <!-- TRANSACTION TYPE -->
    <oj-select-single
      id="txnType"
      label-hint="Type"
      value="{{type}}"
      data="[[typeOptions]]">
    </oj-select-single>

  </oj-form-layout>

  <!-- CREATE TRANSACTION -->
  <oj-button
    on-oj-action="[[createTransaction]]"
    chroming="callToAction">
    Create Transaction
  </oj-button>

  <!-- TRANSACTIONS -->
  <h3>All Transactions</h3>

  <p>
    Debug count:
    <span data-bind="text: transactions().length"></span>
  </p>

  <!-- TRANSACTIONS TABLE -->
  <oj-table
    data="[[dataProvider]]"
    columns="[[columns]]"
    aria-label="Transactions Table"
    display="grid"
    style="width:100%">
  </oj-table>

</div>
